<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <title>Notifications - Polling Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
    #badge { background: red; color: white; border-radius: 50%; padding: 4px 10px; font-size: 14px; }
    .notif { border: 1px solid #ccc; padding: 10px; margin: 8px 0; border-radius: 6px; }
    .notif.unread { background: #fff8e1; }
  </style>
</head>
<body>
  <h2>🔔 Notifications <span id="badge">0</span></h2>
  <div id="notifList"></div>

  <script>
    const studentId = 1; // testing ke liye fixed rakha hai

    async function checkNotifications() {
      try {
        const res = await fetch(`http://localhost:5000/api/notifications/${studentId}/unread-summary`);
        const data = await res.json();

        document.getElementById('badge').innerText = data.unread_count;

        const listDiv = document.getElementById('notifList');
        listDiv.innerHTML = '';
        data.latest_unread.forEach(n => {
          const div = document.createElement('div');
          div.className = 'notif unread';
          div.innerHTML = `<strong>${n.title}</strong><br>${n.message}`;
          listDiv.appendChild(div);
        });
      } catch (err) {
        console.error('Polling error:', err);
      }
    }

    // Turant ek baar check karo
    checkNotifications();

    // Har 10 second baad dubara check karo (ye hi polling hai)
    setInterval(checkNotifications, 10000);
  </script>
</body>
</html>
